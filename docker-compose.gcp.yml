# Overlay opcional — só para comandos Terraform contra GCP de verdade
# (Fase 4, README.md). Nunca usado sozinho; sempre combinado com
# docker-compose.yml, e sempre via infra/scripts/with_terraform_credentials.sh
# (comandos manuais) ou infra/scripts/cloud_smoke_test.py (orquestrado):
#
#   infra/scripts/with_terraform_credentials.sh <project-id> -- \
#     docker compose -f docker-compose.yml -f docker-compose.gcp.yml \
#     run --rm --entrypoint terraform tools -chdir=infra/bootstrap apply -var="project_id=..."
#
# Nenhuma chave de service account existe em lugar nenhum (bloqueada pela
# política de organização desta conta, e desnecessária de qualquer forma):
# o wrapper minta um token de acesso de curta duração via impersonação
# (roles/iam.serviceAccountTokenCreator, concedido por
# infra/scripts/create_terraform_service_account.sh) e passa como
# GOOGLE_OAUTH_ACCESS_TOKEN — o provider `google` do Terraform usa esse
# token diretamente, sem nenhum arquivo montado. Nunca defina essa
# variável manualmente/permanentemente.

services:
  tools:
    environment:
      - GOOGLE_OAUTH_ACCESS_TOKEN
