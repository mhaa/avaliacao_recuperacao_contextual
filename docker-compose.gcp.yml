# Overlay opcional — só para comandos Terraform contra GCP de verdade
# (Fase 4, README.md). Nunca usado sozinho; sempre combinado com
# docker-compose.yml, e sempre via infra/scripts/with_terraform_credentials.sh
# (comandos manuais) ou infra/scripts/cloud_smoke_test.py (orquestrado):
#
#   infra/scripts/with_terraform_credentials.sh <project-id> -- \
#     docker compose -f docker-compose.yml -f docker-compose.gcp.yml \
#     run --rm --entrypoint terraform tools -chdir=infra/bootstrap apply -var="project_id=..."
#
# A chave da service account fica só no Secret Manager (segredo
# "tcc-terraform-key", criado por
# infra/scripts/create_terraform_service_account.sh) — nunca em arquivo
# permanente. GCP_TERRAFORM_KEY_PATH aponta pra um arquivo temporário que o
# wrapper busca do Secret Manager e apaga logo depois de cada comando;
# nunca defina essa variável manualmente/permanentemente.

services:
  tools:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-terraform-key.json
    volumes:
      - ${GCP_TERRAFORM_KEY_PATH:?defina GCP_TERRAFORM_KEY_PATH com o caminho da chave, fora do repo}:/run/secrets/gcp-terraform-key.json:ro
